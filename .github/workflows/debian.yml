name: Debian Packages
on:
  push:
    paths:
      - ".github/workflows/debian.yml"
      - "debian/**"

jobs:
  debian-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            packages_allarch: "cartesi-machine-linux-image cartesi-machine-rootfs-image"
          - runner: ubuntu-24.04-arm
            arch: arm64
            packages_allarch: ""
          - runner: ubuntu-24.04-riscv
            arch: riscv64
            packages_allarch: ""

    runs-on: ${{ matrix.runner }}
    name: Debian Build
    permissions:
      packages: write
      contents: read
      id-token: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Make builder container image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: debian
          file: debian/Dockerfile
          platforms: linux/${{ matrix.arch }}
          tags: cartesi/deb-builder-${{ matrix.arch }}
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      - name: Build not riscv64 packages
        id: build-all
        if: matrix.arch != 'riscv64'
        continue-on-error: true
        working-directory: debian
        run: |
            make packages \
              TARGET_ARCH=${{ matrix.arch }} \
              PACKAGES_ALLARCH="${{ matrix.packages_allarch }}"

      - name: Build riscv64 packages only
        id: build-riscv64
        if: matrix.arch == 'riscv64'
        continue-on-error: true
        working-directory: debian
        run: |
            make -k packages \
              TARGET_ARCH=${{ matrix.arch }} \
              PACKAGES="cartesi-machine-guest-tools"

      - name: Export builder container image
        run: docker save cartesi/deb-builder-${{ matrix.arch }} | gzip > /tmp/deb-builder-${{ matrix.arch }}.tar.gz

      - name: Upload builder container image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-deb-builder-${{ matrix.arch }}
          path: /tmp/deb-builder-${{ matrix.arch }}.tar.gz
          compression-level: 0

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-apt-${{ matrix.arch }}
          path: cdn/apt

      - name: Fail job if any package failed to build
        if: steps.build-all.outcome == 'failure' || steps.build-riscv64.outcome == 'failure'
        run: |
          echo "One or more packages failed to build for ${{ matrix.arch }} (see 'Build packages' step). Already-built packages were still uploaded."
          exit 1

  debian-check:
    name: Debian Check
    runs-on: ubuntu-24.04
    needs: debian-build
    outputs:
      packages_built: ${{ steps.check.outputs.packages_built }}
    steps:
      - name: Download apt artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-apt-*
          path: cdn/apt/
          merge-multiple: true
      - name: Check for new packages
        id: check
        run: |
          if find cdn/apt/stable -name '*.deb' -size +1000c | grep -q .; then
            echo "packages_built=true" >> $GITHUB_OUTPUT
          else
            echo "packages_built=false" >> $GITHUB_OUTPUT
          fi

  debian-test:
    name: Debian Test
    runs-on: ubuntu-24.04
    needs: [debian-build, debian-check]
    if: needs.debian-check.outputs.packages_built == 'true'
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Download apt artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-apt-*
          path: cdn/apt/
          merge-multiple: true

      - name: Download builder images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-deb-builder-*
          path: /tmp/images

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Import builder images
        run: find /tmp/images -name '*.tar.gz' | xargs -I {} docker image load --input {}

      - name: Make index
        working-directory: debian
        run: make index

      - name: Test
        working-directory: debian
        run: |
          make test-packages TARGET_ARCH=amd64
          make test-packages TARGET_ARCH=arm64
          make test-packages TARGET_ARCH=riscv64

  debian-sign:
    runs-on: ubuntu-24.04
    name: Debian Signing
    needs: [debian-build, debian-test, debian-check]
    if: needs.debian-check.outputs.packages_built == 'true'
    #FIXME: uncoment when have final signing key
    #if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && needs.debian-check.outputs.packages_built == 'true'
    environment: signing
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Download apt artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-apt-*
          path: cdn/apt/
          merge-multiple: true

      - name: Download builder images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-deb-builder-amd64
          path: /tmp/images

      - name: Import builder images
        run: find /tmp/images -name '*.tar.gz' | xargs -I {} docker image load --input {}

      - name: Import GPG signing key
        working-directory: debian
        env:
          DEB_KEY: ${{ secrets.DEB_KEY }}
        run: |
          mkdir -p key
          chmod 700 key
          echo "$DEB_KEY" | gpg --homedir "$(pwd)/key" --import

      - name: Make index
        working-directory: debian
        run: make index

      - name: Sign repository
        working-directory: debian
        run: make sign

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-artifacts-apt
          path: cdn

  publish:
    name: Debian Publish
    needs: debian-sign
    #FIXME: uncoment when process is validated
    #if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - name: Download signed archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-artifacts-apt
          path: incoming/

      - name: Write production GPG public key
        env:
          DEB_PUB_KEY: ${{ vars.DEB_PUB_KEY }}
        run: |
          mkdir -p incoming/apt/keys
          echo "$DEB_PUB_KEY" > incoming/apt/keys/cartesi-deb-key.gpg
          echo "$DEB_PUB_KEY" | gpg --dearmor -o incoming/apt/keys/cartesi-deb-key.gpg.bin

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.DIST_S3_ROLE_ARN }}
          aws-region: us-east-1

      - name: Publish to S3
        run: aws s3 cp incoming/apt "s3://${{ secrets.DIST_S3_BUCKET_NAME }}/linux/apt" --recursive
